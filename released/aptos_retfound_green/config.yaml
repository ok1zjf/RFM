experiment_name: aptos_retfound_green
results_manifest: outputs/results_manifest.txt
model:
  img_size: 392
  pretrained_weights: weights/retfoundgreen_statedict.pth
  name: retfound-green
trainer:
  max_epochs: 200
  select_best: auroc
  base_lr: 0.001
  weight_decay: 5.0e-06
  batch_size: 64
  num_workers: 16
  eval_batch_size: 256
  eval_num_workers: 10
  resize_before_crop: null
data:
  plot_auroc_ci_band: true
  plot_auprc_ci_band: true
  images_root: datasets/aptos-2019/
  csv_path: datasets/aptos-2019_splits.csv
  phenotype: dr_grade
  num_classes: 5
  class_names:
  - Grade 0
  - Grade 1
  - Grade 2
  - Grade 3
  - Grade 4
  train_split: t
  val_split: v
  test_split: e
seed: 42
