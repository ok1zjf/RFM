defaults:
  - _defaults
  - _self_

experiment_name: messidor_dinov3b-9l

model:
  img_size: 336
  pretrained_weights: weights/vit_base_patch16_dinov3.lvd1689m

trainer:
  max_epochs: 200
  select_best: auroc      # validation metric picking which epoch's weights get tested (auroc,
                          # auroc+f1, balanced_acc, f1, acc, loss)
                          # null tests the final epoch's weights instead
  base_lr: 0.001
  weight_decay: 5.0e-05
  batch_size: 64
  num_workers: 16
  eval_batch_size: 256
  eval_num_workers: 10
  resize_before_crop: null

data:
  plot_auroc_ci_band: true  # shaded 95% bootstrap band on the ROC curve
  plot_auprc_ci_band: true  # shaded 95% bootstrap band on the PR curve
  images_root: datasets/messidor2/
  csv_path: datasets/messidor2_splits.csv
  phenotype: dr_grade
  num_classes: 5
  class_names: ["Grade 0", "Grade 1", "Grade 2", "Grade 3", "Grade 4"]
  train_split: t
  val_split: v
  test_split: e
