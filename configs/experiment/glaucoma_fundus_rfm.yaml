defaults:
  - _defaults
  - _self_

experiment_name: glaucoma_fundus_rfm

model:
  img_size: 336
  pretrained_weights: weights/rfm-1.3.pt

trainer:
  max_epochs: 200
  select_best: auroc      # validation metric picking which epoch's weights get tested (auroc,
                          # auroc+f1, balanced_acc, f1, acc, loss)
                          # null tests the final epoch's weights instead
  base_lr: 0.001
  weight_decay: 5.0e-05
  batch_size: 64
  num_workers: 16
  eval_batch_size: 256
  eval_num_workers: 10
  resize_before_crop: 512

data:
  plot_auroc_ci_band: true  # shaded 95% bootstrap band on the ROC curve
  plot_auprc_ci_band: true  # shaded 95% bootstrap band on the PR curve
  images_root: datasets/gfid/
  csv_path: datasets/gfid_splits.csv
  phenotype: glaucoma_grade
  num_classes: 3
  class_names: ["No glaucoma", "Early glaucoma", "Advanced glaucoma"]
  train_split: t
  val_split: v
  test_split: e
